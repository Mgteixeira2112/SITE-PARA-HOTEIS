name: Hotel OS validation

on:
  push:
    branches: [main, plano-mestre-hotel-os, fase-17-publicacao]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Run test suite
        run: bun run test 2>&1 | tee test-output.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-os-test-output-latest
          path: test-output.txt
          retention-days: 1
      - run: bun run build
      - run: bun run audit:production
